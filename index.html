<!-- JAVASCRIPT LOGIC -->
<script>
// ============================================================================
// [실시간 동기화 설정] Firebase Realtime Database URL
// ============================================================================
const FIREBASE_CONFIG = {
  databaseURL: "https://jtech-m-default-rtdb.firebaseio.com"
};

const SYNC_URL_STORAGE_KEY = "jtech_firebase_db_url";
let rtdb = null;
let categoriesRef = null;
let adminPwRef = null;
let isRealtimeConnected = false;

function getEffectiveDatabaseUrl() {
  const savedUrl = localStorage.getItem(SYNC_URL_STORAGE_KEY);
  if (savedUrl && savedUrl.startsWith("https://")) {
    return savedUrl.trim();
  }
  if (FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.startsWith("https://")) {
    return FIREBASE_CONFIG.databaseURL.trim();
  }
  return null;
}

// 서비스 워커 등록 및 새 버전 감지 시 자동 새로고침
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker Registered', reg))
      .catch(err => console.log('Service Worker Error', err));
  });

  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload();
    }
  });
}

// 관리자 비밀번호 관리 (초기 비밀번호: 1234)
const ADMIN_PW_KEY = "jtech_admin_password";
let cachedAdminPassword = localStorage.getItem(ADMIN_PW_KEY) || "1234";

function getAdminPassword() {
  return cachedAdminPassword || "1234";
}

async function setAdminPassword(newPw) {
  cachedAdminPassword = newPw;
  localStorage.setItem(ADMIN_PW_KEY, newPw);
  if (adminPwRef && isRealtimeConnected) {
    try {
      await adminPwRef.set(newPw);
    } catch (e) {
      console.error("비밀번호 서버 동기화 실패:", e);
    }
  }
}

function requestAdminAccess() {
  const modal = document.getElementById("password-modal");
  const input = document.getElementById("admin-pw-input");
  const errorMsg = document.getElementById("admin-pw-error");
  input.value = "";
  errorMsg.classList.add("hidden");
  modal.classList.remove("hidden");
  setTimeout(() => input.focus(), 50);
}

function closePasswordModal() {
  document.getElementById("password-modal").classList.add("hidden");
}

function verifyAdminPassword(event) {
  event.preventDefault();
  const input = document.getElementById("admin-pw-input");
  const errorMsg = document.getElementById("admin-pw-error");
  if (input.value === getAdminPassword()) {
    closePasswordModal();
    toggleAdminModal(true);
  } else {
    errorMsg.classList.remove("hidden");
    input.value = "";
    input.focus();
  }
}

async function changeAdminPasswordPrompt() {
  const currentPw = prompt("현재 비밀번호를 입력하세요:");
  if (currentPw === null) return;
  if (currentPw !== getAdminPassword()) {
    alert("현재 비밀번호가 일치하지 않습니다.");
    return;
  }
  const newPw = prompt("새 비밀번호를 입력하세요 (4자 이상 권장):");
  if (newPw && newPw.trim().length > 0) {
    await setAdminPassword(newPw.trim());
    alert("비밀번호가 변경되었습니다.");
  }
}

const DEFAULT_CATEGORIES = [
  "JTECH", "시험성적서", "보양작업", "시공완료", "하자보수",
  "유색컬러시공", "구축시공", "시공후하자", "고객후기", "가격표&서비스"
];

let currentMediaList = [];
let currentViewerIndex = 0;

let currentSortOrder = "asc";

function sortMediaArray(items) {
  if (!items || !Array.isArray(items)) return [];
  const copy = [...items];
  if (currentSortOrder === "asc") {
    return copy.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko", { numeric: true, sensitivity: "base" }));
  } else if (currentSortOrder === "desc") {
    return copy.sort((a, b) => (b.name || "").localeCompare(a.name || "", "ko", { numeric: true, sensitivity: "base" }));
  } else {
    return copy.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  }
}

function changeSortOrder(order) {
  currentSortOrder = order;
  const gallerySelect = document.getElementById("gallery-sort-select");
  const adminSelect = document.getElementById("admin-sort-select");
  if (gallerySelect) gallerySelect.value = order;
  if (adminSelect) adminSelect.value = order;

  if (currentCategoryId) {
    if (!document.getElementById("view-gallery").classList.contains("hidden")) {
      openCategory(currentCategoryId);
    }
    if (!document.getElementById("admin-modal").classList.contains("hidden")) {
      renderAdminMediaGrid();
    }
  }
}

const DB_NAME = "JTechConsultationDB";
const DB_VERSION = 1;
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains("categories")) {
        database.createObjectStore("categories", { keyPath: "id" });
      }
      if (!database.objectStoreNames.contains("media")) {
        database.createObjectStore("media", { keyPath: "id" });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    request.onerror = (e) => reject(e);
  });
}

function getLocalCategoriesFromDB() {
  return new Promise((resolve) => {
    const tx = db.transaction("categories", "readonly");
    const store = tx.objectStore("categories");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function getAllMediaFromDB() {
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readonly");
    const store = tx.objectStore("media");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function saveLocalCategoriesToDB(catArray) {
  return new Promise((resolve) => {
    const tx = db.transaction("categories", "readwrite");
    const store = tx.objectStore("categories");
    store.clear();
    catArray.forEach(cat => store.put(cat));
    tx.oncomplete = () => resolve();
  });
}

async function persistCategories() {
  updateSyncStatusUI("saving");
  await saveLocalCategoriesToDB(categories);
  if (categoriesRef) {
    try {
      await categoriesRef.set(categories);
    } catch (err) {
      console.error("서버 카테고리 저장 오류:", err);
    }
  }
  updateSyncStatusUI("idle");
}

function saveMediaItem(item) {
  updateSyncStatusUI("saving");
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readwrite");
    const store = tx.objectStore("media");
    store.put(item);
    tx.oncomplete = () => {
      updateSyncStatusUI("idle");
      resolve();
    };
  });
}

function deleteMediaItemFromDB(id) {
  updateSyncStatusUI("saving");
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readwrite");
    const store = tx.objectStore("media");
    store.delete(id);
    tx.oncomplete = () => {
      updateSyncStatusUI("idle");
      resolve();
    };
  });
}

async function migrateMediaCategoryIds(localCats, serverCats, allMedia) {
  if (!localCats || localCats.length === 0 || !allMedia || allMedia.length === 0) return allMedia;

  const oldIdToName = {};
  localCats.forEach(c => {
    oldIdToName[c.id] = c.name;
  });

  DEFAULT_CATEGORIES.forEach((name, idx) => {
    oldIdToName["default_idx_" + idx] = name;
  });

  const nameToNewId = {};
  serverCats.forEach(c => {
    nameToNewId[c.name] = c.id;
  });

  const validServerIds = new Set(serverCats.map(c => c.id));

  for (let item of allMedia) {
    if (!validServerIds.has(item.categoryId)) {
      let matchedName = oldIdToName[item.categoryId];
      if (!matchedName && typeof item.categoryId === "string" && item.categoryId.startsWith("cat_")) {
        const parts = item.categoryId.split("_");
        const lastIdx = parseInt(parts[parts.length - 1], 10);
        if (!isNaN(lastIdx) && DEFAULT_CATEGORIES[lastIdx]) {
          matchedName = DEFAULT_CATEGORIES[lastIdx];
        }
      }
      if (matchedName && nameToNewId[matchedName]) {
        item.categoryId = nameToNewId[matchedName];
        await saveMediaItem(item);
      }
    }
  }
  return allMedia;
}

async function applyCategoriesAndRender(newCategories, previousLocalCats) {
  categories = newCategories.map((c, idx) => ({
    id: c.id,
    name: c.name,
    order: typeof c.order === "number" ? c.order : idx
  })).sort((a, b) => a.order - b.order);

  let allMedia = await getAllMediaFromDB();
  if (previousLocalCats && previousLocalCats.length > 0) {
    allMedia = await migrateMediaCategoryIds(previousLocalCats, categories, allMedia);
  }

  await saveLocalCategoriesToDB(categories);

  mediaStorage = {};
  categories.forEach(c => mediaStorage[c.id] = []);
  allMedia.forEach(item => {
    if (mediaStorage[item.categoryId]) {
      mediaStorage[item.categoryId].push(item);
    }
  });

  if (currentCategoryId && !categories.some(c => c.id === currentCategoryId)) {
    currentCategoryId = categories.length > 0 ? categories[0].id : null;
  }

  if (!document.getElementById("view-gallery").classList.contains("hidden") && currentCategoryId) {
    openCategory(currentCategoryId);
  } else {
    renderCategoryGrid();
  }

  if (!document.getElementById("admin-modal").classList.contains("hidden")) {
    renderAdminCategories();
  }

  updateSyncStatusUI("idle");
}

async function loadDataFromDB() {
  updateSyncStatusUI("saving");
  await initDB();

  const localCats = await getLocalCategoriesFromDB();
  const dbUrl = getEffectiveDatabaseUrl();

  let initialCats = localCats;
  if (!initialCats || initialCats.length === 0) {
    initialCats = DEFAULT_CATEGORIES.map((name, index) => ({
      id: "cat_fixed_" + index,
      name: name,
      order: index
    }));
  }
  await applyCategoriesAndRender(initialCats, []);

  if (dbUrl && typeof firebase !== "undefined") {
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: dbUrl });
      }
      rtdb = firebase.database();
      categoriesRef = rtdb.ref("jtech_categories");
      adminPwRef = rtdb.ref("jtech_config/adminPassword");

      rtdb.ref(".info/connected").on("value", (snap) => {
        isRealtimeConnected = (snap.val() === true);
        updateSyncStatusUI("idle");
      });

      adminPwRef.on("value", (snap) => {
        const serverPw = snap.val();
        if (serverPw) {
          cachedAdminPassword = String(serverPw);
          localStorage.setItem(ADMIN_PW_KEY, cachedAdminPassword);
        }
      });

      categoriesRef.on("value", async (snapshot) => {
        const prevLocalCats = await getLocalCategoriesFromDB();
        const serverData = snapshot.val();

        if (!serverData) {
          const seedCats = (prevLocalCats && prevLocalCats.length > 0 ? prevLocalCats : initialCats).map((c, idx) => ({
            id: c.id.startsWith("cat_fixed_") ? c.id : "cat_fixed_" + idx,
            name: c.name,
            order: idx
          }));
          await categoriesRef.set(seedCats);
          await applyCategoriesAndRender(seedCats, prevLocalCats);
        } else {
          const serverList = Array.isArray(serverData)
            ? serverData.filter(Boolean)
            : Object.values(serverData).filter(Boolean);
          await applyCategoriesAndRender(serverList, prevLocalCats);
        }
      });
    } catch (err) {
      console.error("실시간 DB 초기화 실패 (로컬 모드로 작동):", err);
      updateSyncStatusUI("idle");
    }
  } else {
    updateSyncStatusUI("idle");
  }
}

// ============================================================================
// [전체화면 미디어 뷰어: 핀치 줌 + 더블탭 줌 + 드래그 애니메이션 닫기]
// ============================================================================
let zoomScale = 1;
let panX = 0;
let panY = 0;
let startPanX = 0;
let startPanY = 0;
let initialPinchDistance = null;
let initialZoomScale = 1;
let gestureMode = null; // 'pinch' | 'pan' | 'decide' | 'drag-close' | 'swipe-horizontal'
let touchStartX = 0;
let touchStartY = 0;
let touchCurrentX = 0;
let touchCurrentY = 0;
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;

function getActiveMediaElement() {
  const imgEl = document.getElementById("viewer-image");
  const videoEl = document.getElementById("viewer-video");
  return !imgEl.classList.contains("hidden") ? imgEl : videoEl;
}

function setViewerOverlayOpacity(opacity) {
  const header = document.getElementById("viewer-header");
  const footer = document.getElementById("viewer-footer");
  // 화살표 버튼의 마우스 hover 제어와 충돌하지 않도록 상/하단 바만 투명도 제어
  [header, footer].forEach(el => {
    if (el) el.style.opacity = String(opacity);
  });
}

function updateZoomUI() {
  const resetBtn = document.getElementById("zoom-reset-btn");
  if (!resetBtn) return;
  if (zoomScale > 1.02) {
    resetBtn.classList.remove("hidden");
    resetBtn.classList.add("flex");
    resetBtn.innerText = Math.round(zoomScale * 100) + "%";
  } else {
    resetBtn.classList.add("hidden");
    resetBtn.classList.remove("flex");
  }
}

function applyMediaTransform(withTransition = false) {
  const activeEl = getActiveMediaElement();
  if (!activeEl) return;
  activeEl.style.transition = withTransition ? "transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)" : "none";
  activeEl.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${zoomScale})`;
  updateZoomUI();
}

function resetMediaZoom(withTransition = false) {
  zoomScale = 1;
  panX = 0;
  panY = 0;
  initialPinchDistance = null;
  gestureMode = null;

  const modal = document.getElementById("viewer-modal");
  const imgEl = document.getElementById("viewer-image");
  const videoEl = document.getElementById("viewer-video");

  if (modal) modal.style.backgroundColor = "rgba(0, 0, 0, 1)";
  setViewerOverlayOpacity(1);

  [imgEl, videoEl].forEach(el => {
    if (el) {
      el.style.transition = withTransition ? "transform 0.25s ease-out" : "none";
      el.style.transform = "translate3d(0px, 0px, 0) scale(1)";
    }
  });
  updateZoomUI();
}

function clampPanBounds() {
  const container = document.getElementById("viewer-container");
  if (!container || zoomScale <= 1) {
    panX = 0;
    panY = 0;
    return;
  }
  const maxPanX = (container.clientWidth * (zoomScale - 1)) / 2;
  const maxPanY = (container.clientHeight * (zoomScale - 1)) / 2;
  panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
  panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
}

function getTouchDistance(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.hypot(dx, dy);
}

function openViewer(index) {
  if (!currentCategoryId) return;
  currentMediaList = sortMediaArray(mediaStorage[currentCategoryId] || []);
  if (currentMediaList.length === 0) return;

  currentViewerIndex = index;
  const modal = document.getElementById("viewer-modal");
  modal.classList.remove("hidden");

  resetMediaZoom(false);
  updateViewerContent();
}

function updateViewerContent() {
  resetMediaZoom(false);

  const item = currentMediaList[currentViewerIndex];
  const category = categories.find(c => c.id === currentCategoryId);

  document.getElementById("viewer-category-tag").innerText = category ? category.name : "";
  document.getElementById("viewer-title").innerText = item.name;
  document.getElementById("viewer-index").innerText = currentViewerIndex + 1;
  document.getElementById("viewer-total").innerText = currentMediaList.length;

  const imgEl = document.getElementById("viewer-image");
  const videoEl = document.getElementById("viewer-video");

  imgEl.className = `w-full h-full ${isFitContain ? 'media-fit-contain' : 'media-fit-cover'}`;
  videoEl.className = `w-full h-full ${isFitContain ? 'media-fit-contain' : 'media-fit-cover'}`;

  if (item.type.startsWith("image/")) {
    videoEl.pause();
    videoEl.classList.add("hidden");
    imgEl.src = item.dataUrl;
    imgEl.classList.remove("hidden");
  } else {
    imgEl.classList.add("hidden");
    videoEl.src = item.dataUrl;
    videoEl.classList.remove("hidden");
    videoEl.play().catch(() => {});
  }
}

function closeViewer() {
  const videoEl = document.getElementById("viewer-video");
  videoEl.pause();
  resetMediaZoom(false);
  document.getElementById("viewer-modal").classList.add("hidden");
}

function nextMedia() {
  if (currentMediaList.length === 0) return;
  currentViewerIndex = (currentViewerIndex + 1) % currentMediaList.length;
  updateViewerContent();
}

function prevMedia() {
  if (currentMediaList.length === 0) return;
  currentViewerIndex = (currentViewerIndex - 1 + currentMediaList.length) % currentMediaList.length;
  updateViewerContent();
}

function toggleMediaFit() {
  isFitContain = !isFitContain;
  const fitIcon = document.getElementById("fit-icon");
  if (isFitContain) {
    fitIcon.className = "fa-solid fa-expand";
  } else {
    fitIcon.className = "fa-solid fa-compress";
  }
  updateViewerContent();
}

const viewerContainer = document.getElementById("viewer-container");

viewerContainer.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    gestureMode = "pinch";
    initialPinchDistance = getTouchDistance(e.touches[0], e.touches[1]);
    initialZoomScale = zoomScale;
    return;
  }

  if (e.touches.length === 1) {
    const touch = e.touches[0];
    const now = Date.now();

    const videoEl = document.getElementById("viewer-video");
    if (!videoEl.classList.contains("hidden") && touch.clientY > window.innerHeight - 80) {
      gestureMode = null;
      return;
    }

    if (now - lastTapTime < 300 && Math.hypot(touch.clientX - lastTapX, touch.clientY - lastTapY) < 35) {
      e.preventDefault();
      if (zoomScale > 1.05) {
        resetMediaZoom(true);
      } else {
        zoomScale = 2.5;
        panX = 0;
        panY = 0;
        applyMediaTransform(true);
      }
      lastTapTime = 0;
      gestureMode = null;
      return;
    }

    lastTapTime = now;
    lastTapX = touch.clientX;
    lastTapY = touch.clientY;

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchCurrentX = touch.clientX;
    touchCurrentY = touch.clientY;

    if (zoomScale > 1.02) {
      gestureMode = "pan";
      startPanX = touch.clientX - panX;
      startPanY = touch.clientY - panY;
    } else {
      gestureMode = "decide";
    }
  }
}, { passive: false });

viewerContainer.addEventListener("touchmove", (e) => {
  if (!gestureMode) return;

  if (gestureMode === "pinch" && e.touches.length === 2) {
    e.preventDefault();
    const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
    if (initialPinchDistance && initialPinchDistance > 0) {
      const ratio = currentDist / initialPinchDistance;
      zoomScale = Math.min(Math.max(1, initialZoomScale * ratio), 4);
      clampPanBounds();
      applyMediaTransform(false);
    }
    return;
  }

  if (e.touches.length !== 1) return;
  const touch = e.touches[0];
  touchCurrentX = touch.clientX;
  touchCurrentY = touch.clientY;

  const dx = touchCurrentX - touchStartX;
  const dy = touchCurrentY - touchStartY;

  if (gestureMode === "pan") {
    e.preventDefault();
    panX = touch.clientX - startPanX;
    panY = touch.clientY - startPanY;
    clampPanBounds();
    applyMediaTransform(false);
    return;
  }

  if (gestureMode === "decide") {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;

    if (dy > 0 && Math.abs(dy) > Math.abs(dx) * 1.2) {
      gestureMode = "drag-close";
    } else if (Math.abs(dx) > Math.abs(dy)) {
      gestureMode = "swipe-horizontal";
    } else {
      gestureMode = null;
      return;
    }
  }

  if (gestureMode === "drag-close") {
    e.preventDefault();
    const dragY = Math.max(0, dy);
    const dragX = dx * 0.25;
    const dragScale = Math.max(0.78, 1 - dragY / 1000);
    const bgAlpha = Math.max(0.15, 1 - dragY / 380);
    const uiOpacity = Math.max(0, 1 - dragY / 180);

    const activeEl = getActiveMediaElement();
    const modal = document.getElementById("viewer-modal");

    if (activeEl) {
      activeEl.style.transition = "none";
      activeEl.style.transform = `translate3d(${dragX}px, ${dragY}px, 0) scale(${dragScale})`;
    }
    if (modal) {
      modal.style.backgroundColor = `rgba(0, 0, 0, ${bgAlpha})`;
    }
    setViewerOverlayOpacity(uiOpacity);
  }
}, { passive: false });

viewerContainer.addEventListener("touchend", (e) => {
  if (gestureMode === "pinch") {
    if (zoomScale < 1.05) {
      resetMediaZoom(true);
    } else if (e.touches.length === 1) {
      gestureMode = "pan";
      startPanX = e.touches[0].clientX - panX;
      startPanY = e.touches[0].clientY - panY;
    } else {
      gestureMode = null;
    }
    return;
  }

  if (gestureMode === "drag-close") {
    const dy = touchCurrentY - touchStartY;
    const activeEl = getActiveMediaElement();
    const modal = document.getElementById("viewer-modal");

    if (dy > 110) {
      if (activeEl) {
        activeEl.style.transition = "transform 0.2s ease-in, opacity 0.2s ease-in";
        activeEl.style.transform = `translate3d(0px, ${window.innerHeight}px, 0) scale(0.75)`;
      }
      if (modal) {
        modal.style.backgroundColor = "rgba(0, 0, 0, 0)";
      }
      setTimeout(() => {
        if (activeEl) activeEl.style.opacity = "1";
        closeViewer();
      }, 200);
    } else {
      resetMediaZoom(true);
    }
    gestureMode = null;
    return;
  }

  if (gestureMode === "swipe-horizontal") {
    const dx = touchCurrentX - touchStartX;
    if (dx < -50) nextMedia();
    if (dx > 50) prevMedia();
    gestureMode = null;
    return;
  }

  if (e.touches.length === 0) {
    gestureMode = null;
  }
}, false);

function toggleAdminModal(show) {
  const modal = document.getElementById("admin-modal");
  if (show) {
    renderAdminCategories();
    modal.classList.remove("hidden");
  } else {
    modal.classList.add("hidden");
    if (currentCategoryId) {
      openCategory(currentCategoryId);
    } else {
      renderCategoryGrid();
    }
  }
}

function renderAdminCategories() {
  const catList = document.getElementById("admin-category-list");
  document.getElementById("cat-count").innerText = categories.length;
  catList.innerHTML = "";

  if (!currentCategoryId && categories.length > 0) {
    currentCategoryId = categories[0].id;
  }

  categories.forEach((cat, idx) => {
    const isSelected = cat.id === currentCategoryId;
    const isFirst = idx === 0;
    const isLast = idx === categories.length - 1;

    const row = document.createElement("div");
    row.className = `w-full px-3 py-2 rounded-lg text-xs font-bold flex justify-between items-center gap-1 transition cursor-pointer ${
      isSelected ? 'bg-brand text-white shadow-sm' : 'bg-white text-gray-700 hover:bg-gray-200 border border-gray-200'
    }`;
    row.onclick = () => selectAdminCategory(cat.id);

    const leftPart = document.createElement("div");
    leftPart.className = "flex items-center gap-1.5 min-w-0 flex-1";
    leftPart.innerHTML = `
      <span class="truncate">${cat.name}</span>
      <span class="text-[10px] shrink-0 opacity-80 ${isSelected ? 'bg-white/20 text-white' : 'bg-black/10 text-gray-700'} px-1.5 py-0.5 rounded">
        ${(mediaStorage[cat.id] || []).length}개
      </span>
    `;

    const orderControls = document.createElement("div");
    orderControls.className = "flex items-center gap-1 shrink-0";

    const upBtn = document.createElement("button");
    upBtn.type = "button";
    upBtn.title = "위로 이동";
    upBtn.disabled = isFirst;
    upBtn.className = `w-6 h-6 rounded flex items-center justify-center transition ${
      isFirst
        ? 'opacity-30 cursor-not-allowed'
        : isSelected
          ? 'hover:bg-white/20 text-white'
          : 'hover:bg-gray-300 text-gray-600'
    }`;
    upBtn.innerHTML = `<i class="fa-solid fa-chevron-up text-[10px]"></i>`;
    upBtn.onclick = (e) => moveCategoryOrder(idx, -1, e);

    const downBtn = document.createElement("button");
    downBtn.type = "button";
    downBtn.title = "아래로 이동";
    downBtn.disabled = isLast;
    downBtn.className = `w-6 h-6 rounded flex items-center justify-center transition ${
      isLast
        ? 'opacity-30 cursor-not-allowed'
        : isSelected
          ? 'hover:bg-white/20 text-white'
          : 'hover:bg-gray-300 text-gray-600'
    }`;
    downBtn.innerHTML = `<i class="fa-solid fa-chevron-down text-[10px]"></i>`;
    downBtn.onclick = (e) => moveCategoryOrder(idx, 1, e);

    orderControls.appendChild(upBtn);
    orderControls.appendChild(downBtn);

    row.appendChild(leftPart);
    row.appendChild(orderControls);
    catList.appendChild(row);
  });

  renderAdminMediaGrid();
}

async function moveCategoryOrder(index, direction, event) {
  event.stopPropagation();
  const targetIndex = index + direction;
  if (targetIndex < 0 || targetIndex >= categories.length) return;

  const temp = categories[index];
  categories[index] = categories[targetIndex];
  categories[targetIndex] = temp;

  categories.forEach((cat, idx) => {
    cat.order = idx;
  });

  await persistCategories();
  renderAdminCategories();
  renderTopCategoryBar();
}

function selectAdminCategory(catId) {
  currentCategoryId = catId;
  renderAdminCategories();
}

function renderAdminMediaGrid() {
  const category = categories.find(c => c.id === currentCategoryId);
  const titleEl = document.getElementById("admin-selected-cat-title");
  const grid = document.getElementById("admin-media-grid");

  if (!category) {
    titleEl.innerText = "카테고리를 선택하세요";
    grid.innerHTML = "";
    return;
  }

  titleEl.innerText = category.name;
  const items = sortMediaArray(mediaStorage[currentCategoryId] || []);
  grid.innerHTML = "";

  items.forEach(item => {
    const itemCard = document.createElement("div");
    itemCard.className = "relative aspect-square border border-gray-200 rounded-lg overflow-hidden group bg-black";

    if (item.type.startsWith("image/")) {
      itemCard.innerHTML = `
        <img src="${item.dataUrl}" class="w-full h-full object-cover">
        <div class="absolute bottom-0 inset-x-0 bg-black/70 px-1.5 py-1">
          <p class="text-[10px] text-white truncate">${item.name}</p>
        </div>
      `;
    } else {
      itemCard.innerHTML = `
        <video src="${item.dataUrl}" class="w-full h-full object-cover"></video>
        <div class="absolute bottom-0 inset-x-0 bg-black/70 px-1.5 py-1">
          <p class="text-[10px] text-white truncate">${item.name}</p>
        </div>
      `;
    }

    const delBtn = document.createElement("button");
    delBtn.className = "absolute top-1 right-1 w-6 h-6 bg-red-600 text-white rounded-full flex items-center justify-center text-xs opacity-90 hover:opacity-100 shadow";
    delBtn.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      await deleteMediaItemFromDB(item.id);
      mediaStorage[currentCategoryId] = mediaStorage[currentCategoryId].filter(m => m.id !== item.id);
      renderAdminCategories();
      renderTopCategoryBar();
    };

    itemCard.appendChild(delBtn);
    grid.appendChild(itemCard);
  });
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = (err) => reject(err);
    reader.readAsDataURL(file);
  });
}

async function handleFileUpload(event) {
  const fileList = event.target.files;
  if (!fileList || fileList.length === 0 || !currentCategoryId) return;

  const validFiles = Array.from(fileList).filter(
    f => f.type && (f.type.startsWith("image/") || f.type.startsWith("video/"))
  );

  if (validFiles.length === 0) {
    event.target.value = "";
    return;
  }

  validFiles.sort((a, b) => a.name.localeCompare(b.name, "ko", { numeric: true, sensitivity: "base" }));

  const baseTime = Date.now();
  for (let i = 0; i < validFiles.length; i++) {
    const file = validFiles[i];
    const dataUrl = await readFileAsDataURL(file);
    const mediaObj = {
      id: "media_" + baseTime + "_" + i + "_" + Math.random().toString(36).substr(2, 5),
      categoryId: currentCategoryId,
      name: file.name,
      type: file.type,
      dataUrl: dataUrl,
      createdAt: baseTime + i
    };
    await saveMediaItem(mediaObj);
    if (!mediaStorage[currentCategoryId]) mediaStorage[currentCategoryId] = [];
    mediaStorage[currentCategoryId].push(mediaObj);
  }

  renderAdminCategories();
  renderTopCategoryBar();
  event.target.value = "";
}

async function addNewCategoryPrompt() {
  const name = prompt("새 카테고리 이름을 입력하세요:");
  if (name && name.trim()) {
    const newCat = {
      id: "cat_" + Date.now(),
      name: name.trim(),
      order: categories.length
    };
    categories.push(newCat);
    mediaStorage[newCat.id] = [];
    currentCategoryId = newCat.id;
    await persistCategories();
    renderAdminCategories();
    renderTopCategoryBar();
  }
}

async function renameSelectedCategory() {
  const category = categories.find(c => c.id === currentCategoryId);
  if (!category) return;
  const newName = prompt("카테고리 이름 수정:", category.name);
  if (newName && newName.trim()) {
    category.name = newName.trim();
    await persistCategories();
    renderAdminCategories();
    renderTopCategoryBar();
  }
}

async function deleteSelectedCategory() {
  if (!currentCategoryId) return;
  if (confirm("이 카테고리가 모든 기기에서 삭제되며, 현재 기기의 해당 미디어 파일도 함께 삭제됩니다. 계속하시겠습니까?")) {
    const items = mediaStorage[currentCategoryId] || [];
    for (let item of items) {
      await deleteMediaItemFromDB(item.id);
    }
    delete mediaStorage[currentCategoryId];
    categories = categories.filter(c => c.id !== currentCategoryId);
    categories.forEach((cat, idx) => {
      cat.order = idx;
    });
    currentCategoryId = categories.length > 0 ? categories[0].id : null;
    await persistCategories();
    renderAdminCategories();
    renderTopCategoryBar();
  }
}

function openCategoryAdminFromGallery() {
  requestAdminAccess();
}

document.addEventListener("keydown", (e) => {
  const viewerModal = document.getElementById("viewer-modal");
  const pwModal = document.getElementById("password-modal");
  if (!viewerModal.classList.contains("hidden")) {
    if (e.key === "ArrowRight") nextMedia();
    if (e.key === "ArrowLeft") prevMedia();
    if (e.key === "Escape") closeViewer();
  } else if (!pwModal.classList.contains("hidden")) {
    if (e.key === "Escape") closePasswordModal();
  }
});

window.onload = () => {
  updateSyncStatusUI("idle");
  loadDataFromDB();
};
</script>
