<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JTECH 단열탄성 상담 시스템</title>

<!-- PWA 매니페스트 및 브라우저 테마 색상 -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1d4ed8">

<!-- 브라우저 주소창 파비콘 -->
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">

<!-- iOS(사파리) 홈 화면 바로가기 아이콘 -->
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<!-- 로컬 단일 빌드 CSS (외부 CDN 의존성 제거) -->
<link rel="stylesheet" href="./style.css">
</head>
<body class="bg-gray-50 text-gray-800 h-screen h-[100dvh] flex flex-col overflow-hidden">

<!-- TOP HEADER -->
<header class="bg-white border-b border-gray-200 px-6 py-4 flex flex-col gap-3 shadow-sm shrink-0 z-10">
  <div class="flex items-center justify-between flex-wrap gap-2">
    <div class="flex items-center gap-3">
      <div class="flex flex-col items-center justify-center border-2 border-brand px-4 py-1.5 rounded-md cursor-pointer" onclick="goHome()">
        <span class="text-2xl font-black tracking-wider text-brand leading-none">JTECH</span>
        <span class="text-[10px] font-bold text-gray-500 tracking-tighter mt-0.5">SINCE 2010</span>
        <span class="text-[11px] font-extrabold text-brand tracking-widest leading-none mt-0.5">단열탄성 제이텍</span>
      </div>
    </div>

    <div id="header-title" class="text-xl font-bold text-brand flex items-center gap-2">
      <span>고객 상담 카탈로그</span>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <!-- 실시간 동기화 및 네트워크 상태 표시 배지 -->
      <div id="sync-status-badge" class="px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 border bg-gray-100 text-gray-600 border-gray-200 transition-colors">
        <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-gray-400"></span>
        <span id="sync-status-text">연결 확인 중...</span>
      </div>

      <button onclick="goHome()" id="btn-home" class="hidden px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-brand font-bold flex items-center gap-2 text-sm transition">
        <svg class="svg-icon" viewBox="0 0 576 512" aria-hidden="true"><path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40H456c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H416 392c-22.1 0-40-17.9-40-40V448 384c0-17.7-14.3-32-32-32H256c-17.7 0-32 14.3-32 32v64 24c0 22.1-17.9 40-40 40H160 128.1c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2H104c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7L564.8 231.5c8 7 12 15 11 24z"/></svg>
        메인으로
      </button>
      <button onclick="requestAdminAccess()" class="px-4 py-2 bg-brand hover:bg-brandDark text-white rounded-lg font-bold flex items-center gap-2 text-sm shadow transition">
        <svg class="svg-icon text-xs" viewBox="0 0 448 512" aria-hidden="true"><path d="M144 144v48H304V144c0-44.2-35.8-80-80-80s-80 35.8-80 80zM80 192V144C80 64.5 144.5 0 224 0s144 64.5 144 144v48h16c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V256c0-35.3 28.7-64 64-64H80z"/></svg>
        항목/미디어 관리
      </button>
    </div>
  </div>

  <!-- TOP CATEGORY MENU BAR -->
  <nav id="top-category-bar" class="flex items-center justify-start xl:justify-center gap-2 overflow-x-auto custom-scrollbar pt-2 pb-1 border-t border-gray-100">
    <!-- 동적으로 카테고리 칩 버튼들이 생성됩니다 -->
  </nav>
</header>

<!-- MAIN VIEW CONTAINER -->
<main class="flex-1 min-h-0 relative overflow-y-auto custom-scrollbar p-6">

  <!-- 1. CATEGORY GRID VIEW -->
  <div id="view-categories" class="max-w-7xl mx-auto min-h-full flex flex-col justify-center py-2">
    <div id="category-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 my-auto pb-6">
    </div>
  </div>

  <!-- 2. MEDIA GALLERY GRID VIEW -->
  <div id="view-gallery" class="hidden max-w-7xl mx-auto pb-12">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100 sticky top-0 z-10">
      <div>
        <h2 id="current-category-name" class="text-2xl font-bold text-brand">시공전</h2>
        <p id="current-category-count" class="text-xs text-gray-500 mt-0.5">총 0개의 미디어</p>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center bg-gray-100 rounded-lg px-3 py-1.5 border border-gray-200">
          <svg class="svg-icon text-brand text-xs mr-2" viewBox="0 0 512 512" aria-hidden="true"><path d="M128 32c17.7 0 32 14.3 32 32V338.7l41.4-41.4c12.5-12.5 32.8-12.5 45.3 0s12.5 32.8 0 45.3l-96 96c-12.5 12.5-32.8 12.5-45.3 0l-96-96c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L96 338.7V64c0-17.7 14.3-32 32-32zM352 32c13.3 0 25.3 8.1 30.2 20.4l64 160c6.6 16.4-1.4 35-17.8 41.6s-35-1.4-41.6-17.8L379.5 218H324.5l-7.3 18.2c-6.6 16.4-25.2 24.4-41.6 17.8s-24.4-25.2-17.8-41.6l64-160C326.7 40.1 338.7 32 352 32zm0 94.3L342.1 154h19.8L352 126.3zM288 320c0-17.7 14.3-32 32-32h96c12.4 0 23.7 7.2 29 18.4s3.6 24.5-4.4 34.1L362.3 432H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H320c-12.4 0-23.7-7.2-29-18.4s-3.6-24.5 4.4-34.1L373.7 352H320c-17.7 0-32-14.3-32-32z"/></svg>
          <select id="gallery-sort-select" onchange="changeSortOrder(this.value)" class="bg-transparent text-xs font-bold text-gray-700 focus:outline-none cursor-pointer">
            <option value="asc">이름 오름차순 (기본)</option>
            <option value="desc">이름 내림차순</option>
            <option value="created">등록순</option>
          </select>
        </div>
        <button onclick="goHome()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg text-sm flex items-center gap-1.5 transition">
          <svg class="svg-icon" viewBox="0 0 448 512" aria-hidden="true"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg>
          뒤로가기
        </button>
      </div>
    </div>

    <div id="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 pb-8">
    </div>

    <div id="gallery-empty" class="hidden flex-col items-center justify-center py-20 text-center">
      <svg class="svg-icon text-6xl text-gray-300 mb-3" viewBox="0 0 576 512" aria-hidden="true"><path d="M384 480h48c11.4 0 21.9-6 27.6-15.9l112-192c5.8-9.9 5.8-22.1 .1-32.1S555.5 224 544 224H144c-11.4 0-21.9 6-27.6 15.9L48 357.1V96c0-8.8 7.2-16 16-16H181.5c4.2 0 8.3 1.7 11.3 4.7l26.5 26.5c21 21 49.5 32.8 79.2 32.8H416c8.8 0 16 7.2 16 16v32h48V160c0-35.3-28.7-64-64-64H298.5c-17 0-33.3-6.7-45.3-18.7L226.7 50.7c-12-12-28.3-18.7-45.3-18.7H64C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H87.7 384zM144 272H506.9L414.2 432H64L144 272z"/></svg>
      <p class="text-gray-500 font-medium">등록된 사진이나 동영상이 없습니다.</p>
      <button onclick="openCategoryAdminFromGallery()" class="mt-4 px-4 py-2 bg-brand text-white text-sm font-semibold rounded-lg shadow">
        + 파일 추가하기
      </button>
    </div>
  </div>

</main>

<!-- 3. FULLSCREEN MEDIA VIEWER MODAL -->
<div id="viewer-modal" class="fixed inset-0 bg-black z-50 hidden flex flex-col items-center justify-center select-none transition-colors duration-200">
  <div id="viewer-header" class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 to-transparent z-20 flex justify-between items-center transition-opacity duration-200">
    <div class="text-white">
      <span id="viewer-category-tag" class="text-xs bg-brand text-white px-2.5 py-1 rounded-full font-bold">카테고리</span>
      <h3 id="viewer-title" class="text-base font-medium mt-1 truncate max-w-md">파일명</h3>
    </div>
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- 확대 배율 표시 및 초기화 버튼 (확대 시 활성화) -->
      <button id="zoom-reset-btn" onclick="resetMediaZoom(true)" title="배율 초기화" class="hidden px-3 h-10 rounded-full bg-brand text-white text-xs font-bold items-center justify-center shadow backdrop-blur-md transition">
        100%
      </button>
      <button onclick="toggleMediaFit()" title="화면 맞춤 전환" class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center backdrop-blur-md transition">
        <span id="fit-icon" class="flex items-center justify-center">
          <svg class="svg-icon" viewBox="0 0 448 512" aria-hidden="true"><path d="M32 32C14.3 32 0 46.3 0 64v96c0 17.7 14.3 32 32 32s32-14.3 32-32V96h64c17.7 0 32-14.3 32-32s-14.3-32-32-32H32zM64 352c0-17.7-14.3-32-32-32s-32 14.3-32 32v96c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32s-14.3-32-32-32H64V352zM320 32c-17.7 0-32 14.3-32 32s14.3 32 32 32h64v64c0 17.7 14.3 32 32 32s32-14.3 32-32V64c0-17.7-14.3-32-32-32H320zM448 352c0-17.7-14.3-32-32-32s-32 14.3-32 32v64H320c-17.7 0-32 14.3-32 32s14.3 32 32 32h96c17.7 0 32-14.3 32-32V352z"/></svg>
        </span>
      </button>
      <button onclick="closeViewer()" title="닫기" class="w-10 h-10 rounded-full bg-white/20 hover:bg-red-600 text-white flex items-center justify-center backdrop-blur-md transition">
        <svg class="svg-icon text-lg" viewBox="0 0 384 512" aria-hidden="true"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
      </button>
    </div>
  </div>

  <div class="w-full h-full flex items-center justify-center relative overflow-hidden" id="viewer-container">
    <img id="viewer-image" src="" alt="Full view" class="w-full h-full media-fit-contain hidden">
    <video id="viewer-video" controls class="w-full h-full media-fit-contain hidden" playsinline></video>
  </div>

  <button id="viewer-prev-btn" onclick="prevMedia()" class="absolute left-4 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center backdrop-blur-md z-20 transition border border-white/20">
    <svg class="svg-icon text-2xl" viewBox="0 0 320 512" aria-hidden="true"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l192 192c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256 246.6 86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-192 192z"/></svg>
  </button>
  <button id="viewer-next-btn" onclick="nextMedia()" class="absolute right-4 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center backdrop-blur-md z-20 transition border border-white/20">
    <svg class="svg-icon text-2xl" viewBox="0 0 320 512" aria-hidden="true"><path d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"/></svg>
  </button>

  <div id="viewer-footer" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-md px-4 py-1.5 rounded-full text-white text-xs font-semibold z-20 transition-opacity duration-200">
    <span id="viewer-index">1</span> / <span id="viewer-total">1</span>
  </div>
</div>

<!-- 4. ADMIN PASSWORD LOCK MODAL -->
<div id="password-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden">
    <div class="px-6 py-4 bg-brand text-white flex justify-between items-center">
      <div class="flex items-center gap-2">
        <svg class="svg-icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 0c4.6 0 9.2 1 13.4 2.9L457.7 82.8c22 9.3 38.4 31 38.3 57.2c-.5 99.2-41.3 280.7-213.6 363.2c-16.7 8-36.1 8-52.8 0C57.3 420.7 16.5 239.2 16 140c-.1-26.2 16.3-47.9 38.3-57.2L242.7 2.9C246.8 1 251.4 0 256 0zm0 66.8V444.8C394 378 431.1 230.1 432 141.4L256 66.8l0 0z"/></svg>
        <h3 class="text-base font-bold">관리자 잠금 해제</h3>
      </div>
      <button onclick="closePasswordModal()" class="text-white/80 hover:text-white">
        <svg class="svg-icon text-lg" viewBox="0 0 384 512" aria-hidden="true"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
      </button>
    </div>
    <form onsubmit="verifyAdminPassword(event)" class="p-6 flex flex-col gap-4">
      <div>
        <label for="admin-pw-input" class="block text-xs font-bold text-gray-600 mb-1.5">관리자 비밀번호를 입력하세요</label>
        <input type="password" id="admin-pw-input" inputmode="numeric" placeholder="비밀번호 입력" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-center text-lg font-bold tracking-widest focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20">
        <p id="admin-pw-error" class="hidden text-xs text-red-600 font-semibold mt-1.5 text-center">비밀번호가 일치하지 않습니다.</p>
      </div>
      <div class="flex gap-2 justify-end pt-1">
        <button type="button" onclick="closePasswordModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-bold rounded-lg transition">
          취소
        </button>
        <button type="submit" class="px-5 py-2 bg-brand hover:bg-brandDark text-white text-sm font-bold rounded-lg shadow transition">
          확인
        </button>
      </div>
    </form>
  </div>
</div>

<!-- 5. ADMIN & MEDIA MANAGEMENT MODAL -->
<div id="admin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">

    <div class="px-6 py-4 bg-brand text-white flex justify-between items-center shrink-0 flex-wrap gap-2">
      <div class="flex items-center gap-2">
        <svg class="svg-icon text-xl" viewBox="0 0 512 512" aria-hidden="true"><path d="M0 416c0 17.7 14.3 32 32 32l54.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48L480 448c17.7 0 32-14.3 32-32s-14.3-32-32-32l-246.7 0c-12.3-28.3-40.5-48-73.3-48s-61 19.7-73.3 48L32 384c-17.7 0-32 14.3-32 32zm128 0a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zM320 256a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm32-80c-32.8 0-61 19.7-73.3 48L32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l246.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48l54.7 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-54.7 0c-12.3-28.3-40.5-48-73.3-48zM192 128a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm73.3-64C253 35.7 224.8 16 192 16s-61 19.7-73.3 48L32 64C14.3 64 0 78.3 0 96s14.3 32 32 32l86.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48L480 128c17.7 0 32-14.3 32-32s-14.3-32-32-32L265.3 64z"/></svg>
        <h3 class="text-lg font-bold">카테고리(실시간 동기화) 및 미디어(기기 저장) 관리자</h3>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="configureSyncUrlPrompt()" class="px-3 py-1 bg-white/15 hover:bg-white/25 text-white text-xs font-bold rounded-lg flex items-center gap-1.5 transition">
          <svg class="svg-icon" viewBox="0 0 640 512" aria-hidden="true"><path d="M0 336c0 79.5 64.5 144 144 144H512c70.7 0 128-57.3 128-128c0-61.9-44-113.6-102.4-125.4c4.1-10.7 6.4-22.4 6.4-34.6c0-53-43-96-96-96c-19.7 0-38.1 6-53.3 16.2C367 64.2 315.3 32 256 32C167.6 32 96 103.6 96 192c0 2.7 .1 5.4 .2 8.1C40.2 219.8 0 273.2 0 336z"/></svg>
          동기화 서버 설정
        </button>
        <button onclick="changeAdminPasswordPrompt()" class="px-3 py-1 bg-white/15 hover:bg-white/25 text-white text-xs font-bold rounded-lg flex items-center gap-1.5 transition">
          <svg class="svg-icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M336 352c97.2 0 176-78.8 176-176S433.2 0 336 0S160 78.8 160 176c0 18.7 2.9 36.8 8.3 53.7L7 391c-4.5 4.5-7 10.6-7 17v80c0 13.3 10.7 24 24 24h80c13.3 0 24-10.7 24-24V448h40c13.3 0 24-10.7 24-24V384h40c6.4 0 12.5-2.5 17-7l33.3-33.3c16.9 5.4 35 8.3 53.7 8.3zM376 96a40 40 0 1 1 0 80 40 40 0 1 1 0-80z"/></svg>
          비밀번호 변경
        </button>
        <button onclick="toggleAdminModal(false)" class="text-white/80 hover:text-white text-xl ml-1">
          <svg class="svg-icon" viewBox="0 0 384 512" aria-hidden="true"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
        </button>
      </div>
    </div>

    <div class="flex-1 min-h-0 overflow-hidden grid grid-cols-1 md:grid-cols-3">
      <div class="p-4 border-r border-gray-200 flex flex-col bg-gray-50 min-h-0 h-full">
        <div class="flex justify-between items-center mb-3 shrink-0">
          <h4 class="font-bold text-gray-700 text-sm">카테고리 목록 (<span id="cat-count">0</span>)</h4>
          <button onclick="addNewCategoryPrompt()" class="text-xs bg-brand text-white px-2.5 py-1 rounded hover:bg-brandDark font-semibold">
            + 항목 추가
          </button>
        </div>
        <div id="admin-category-list" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
        </div>

// [실시간 동기화 설정] Firebase Realtime Database 비동기 동적 로드

const FIREBASE_CONFIG = {
  databaseURL: "https://jtech-m-default-rtdb.firebaseio.com"
};

const FIREBASE_SDK_URLS = [
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js",
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"
];

const SYNC_URL_STORAGE_KEY = "jtech_firebase_db_url";
let rtdb = null;
let categoriesRef = null;
let adminPwRef = null;
let isRealtimeConnected = false;
let firebaseSdkPromise = null;
let isFirebaseInitialized = false;

function getEffectiveDatabaseUrl() {
  const savedUrl = localStorage.getItem(SYNC_URL_STORAGE_KEY);
  if (savedUrl && savedUrl.startsWith("https://")) {
    return savedUrl.trim();
  }
  if (FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.startsWith("https://")) {
    return FIREBASE_CONFIG.databaseURL.trim();
  }
  return null;
}

function loadExternalScript(src) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) {
      if (existing.dataset.loaded === "true") {
        resolve();
        return;
      }
      existing.addEventListener("load", () => resolve(), { once: true });
      existing.addEventListener("error", () => reject(new Error("Failed to load " + src)), { once: true });
      return;
    }

    const script = document.createElement("script");
    script.src = src;
    script.async = true;
    script.onload = () => {
      script.dataset.loaded = "true";
      resolve();
    };
    script.onerror = () => {
      script.remove();
      reject(new Error("Failed to load " + src));
    };
    document.head.appendChild(script);
  });
}

async function loadFirebaseSdkAsync() {
  if (typeof firebase !== "undefined" && typeof firebase.database === "function") {
    return true;
  }
  if (!navigator.onLine) {
    return false;
  }
  if (!firebaseSdkPromise) {
    firebaseSdkPromise = (async () => {
      for (const url of FIREBASE_SDK_URLS) {
        await loadExternalScript(url);
      }
      return true;
    })().catch((err) => {
      console.warn("Firebase SDK 비동기 로드 실패 (오프라인 로컬 모드 유지):", err);
      firebaseSdkPromise = null;
      return false;
    });
  }
  return firebaseSdkPromise;
}

async function initFirebaseSync(fallbackInitialCats) {
  if (isFirebaseInitialized) return;
  const dbUrl = getEffectiveDatabaseUrl();
  if (!dbUrl || !navigator.onLine) {
    updateSyncStatusUI("idle");
    return;
  }

  const sdkReady = await loadFirebaseSdkAsync();
  if (!sdkReady || typeof firebase === "undefined") {
    updateSyncStatusUI("idle");
    return;
  }

  try {
    isFirebaseInitialized = true;
    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: dbUrl });
    }
    rtdb = firebase.database();
    categoriesRef = rtdb.ref("jtech_categories");
    adminPwRef = rtdb.ref("jtech_config/adminPassword");

    rtdb.ref(".info/connected").on("value", (snap) => {
      isRealtimeConnected = (snap.val() === true);
      updateSyncStatusUI("idle");
    });

    adminPwRef.on("value", (snap) => {
      const serverPw = snap.val();
      if (serverPw) {
        cachedAdminPassword = String(serverPw);
        localStorage.setItem(ADMIN_PW_KEY, cachedAdminPassword);
      }
    });

    categoriesRef.on("value", async (snapshot) => {
      const prevLocalCats = await getLocalCategoriesFromDB();
      const serverData = snapshot.val();

      if (!serverData) {
        const seedSource = (prevLocalCats && prevLocalCats.length > 0) ? prevLocalCats : fallbackInitialCats;
        const seedCats = seedSource.map((c, idx) => ({
          id: c.id.startsWith("cat_fixed_") ? c.id : "cat_fixed_" + idx,
          name: c.name,
          order: idx
        }));
        await categoriesRef.set(seedCats);
        await applyCategoriesAndRender(seedCats, prevLocalCats);
      } else {
        const serverList = Array.isArray(serverData)
          ? serverData.filter(Boolean)
          : Object.values(serverData).filter(Boolean);
        await applyCategoriesAndRender(serverList, prevLocalCats);
      }
    });
  } catch (err) {
    isFirebaseInitialized = false;
    console.error("실시간 DB 초기화 실패 (로컬 모드로 작동):", err);
    updateSyncStatusUI("idle");
  }
}

function configureSyncUrlPrompt() {
  const currentUrl = getEffectiveDatabaseUrl() || "";
  const inputUrl = prompt(

    alert("올바른 https:// 주소 형식이 아닙니다.");

}

function updateSyncStatusUI(state) {
  const badge = document.getElementById("sync-status-badge");
  const dot = document.getElementById("sync-status-dot");
  const text = document.getElementById("sync-status-text");
  if (!badge || !dot || !text) return;

  const dbUrl = getEffectiveDatabaseUrl();
  const isOnline = navigator.onLine;

  if (state === "saving") {
    badge.className = "px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 border bg-blue-50 text-blue-700 border-blue-200 transition-colors";
    dot.className = "w-2 h-2 rounded-full bg-blue-500 animate-ping";
    text.innerText = "데이터 동기화 중...";
    return;
  }

  if (!dbUrl) {
    badge.className = "px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 border bg-gray-100 text-gray-600 border-gray-300 transition-colors";
    dot.className = "w-2 h-2 rounded-full bg-gray-400";
    text.innerText = "DB 미설정 · 로컬 모드";
    return;
  }

  if (isOnline && isRealtimeConnected) {
    badge.className = "px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 border bg-emerald-50 text-emerald-700 border-emerald-200 transition-colors";
    dot.className = "w-2 h-2 rounded-full bg-emerald-500";

  } else {
    badge.className = "px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 border bg-amber-50 text-amber-700 border-amber-200 transition-colors";
    dot.className = "w-2 h-2 rounded-full bg-amber-500";

  }
}

function sortMediaArray(items) {
  if (!items || !Array.isArray(items)) return [];
  const copy = [...items];
  if (currentSortOrder === "asc") {
    return copy.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko", { numeric: true, sensitivity: "base" }));
  } else if (currentSortOrder === "desc") {
    return copy.sort((a, b) => (b.name || "").localeCompare(a.name || "", "ko", { numeric: true, sensitivity: "base" }));
  } else {
    return copy.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  }
}

function changeSortOrder(order) {

  const gallerySelect = document.getElementById("gallery-sort-select");

  if (adminSelect) adminSelect.value = order;

  if (currentCategoryId) {
    if (!document.getElementById("view-gallery").classList.contains("hidden")) {
      openCategory(currentCategoryId);
    }
    if (!document.getElementById("admin-modal").classList.contains("hidden")) {
      renderAdminMediaGrid();
    }
  }
}

const DB_NAME = "JTechConsultationDB";
const DB_VERSION = 1;
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains("categories")) {
        database.createObjectStore("categories", { keyPath: "id" });
      }
      if (!database.objectStoreNames.contains("media")) {
        database.createObjectStore("media", { keyPath: "id" });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    request.onerror = (e) => reject(e);
  });
}

function getLocalCategoriesFromDB() {
  return new Promise((resolve) => {
    const tx = db.transaction("categories", "readonly");
    const store = tx.objectStore("categories");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function getAllMediaFromDB() {
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readonly");
    const store = tx.objectStore("media");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function saveLocalCategoriesToDB(catArray) {
  return new Promise((resolve) => {
    const tx = db.transaction("categories", "readwrite");
    const store = tx.objectStore("categories");
    store.clear();
    catArray.forEach(cat => store.put(cat));
    tx.oncomplete = () => resolve();
  });
}

async function persistCategories() {
  updateSyncStatusUI("saving");
  await saveLocalCategoriesToDB(categories);
  if (categoriesRef) {
    try {
      await categoriesRef.set(categories);
    } catch (err) {
      console.error("서버 카테고리 저장 오류:", err);
    }
  }
  updateSyncStatusUI("idle");
}

function saveMediaItem(item) {
  updateSyncStatusUI("saving");
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readwrite");
    const store = tx.objectStore("media");
    store.put(item);
    tx.oncomplete = () => {
      updateSyncStatusUI("idle");
      resolve();
    };
  });
}

function deleteMediaItemFromDB(id) {
  updateSyncStatusUI("saving");
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readwrite");
    const store = tx.objectStore("media");
    store.delete(id);
    tx.oncomplete = () => {
      updateSyncStatusUI("idle");
      resolve();
    };
  });
}

async function migrateMediaCategoryIds(localCats, serverCats, allMedia) {
  if (!localCats || localCats.length === 0 || !allMedia || allMedia.length === 0) return allMedia;

  const oldIdToName = {};
  localCats.forEach(c => {
    oldIdToName[c.id] = c.name;
  });

  DEFAULT_CATEGORIES.forEach((name, idx) => {
    oldIdToName["default_idx_" + idx] = name;
  });

  const nameToNewId = {};
  serverCats.forEach(c => {
    nameToNewId[c.name] = c.id;
  });

  const validServerIds = new Set(serverCats.map(c => c.id));

  for (let item of allMedia) {
    if (!validServerIds.has(item.categoryId)) {
      let matchedName = oldIdToName[item.categoryId];
      if (!matchedName && typeof item.categoryId === "string" && item.categoryId.startsWith("cat_")) {
        const parts = item.categoryId.split("_");
        const lastIdx = parseInt(parts[parts.length - 1], 10);
        if (!isNaN(lastIdx) && DEFAULT_CATEGORIES[lastIdx]) {
          matchedName = DEFAULT_CATEGORIES[lastIdx];
        }
      }
      if (matchedName && nameToNewId[matchedName]) {
        item.categoryId = nameToNewId[matchedName];
        await saveMediaItem(item);
      }
    }
  }
  return allMedia;
}

async function applyCategoriesAndRender(newCategories, previousLocalCats) {
  categories = newCategories.map((c, idx) => ({
    id: c.id,
    name: c.name,
    order: typeof c.order === "number" ? c.order : idx
  })).sort((a, b) => a.order - b.order);

  let allMedia = await getAllMediaFromDB();
  if (previousLocalCats && previousLocalCats.length > 0) {
    allMedia = await migrateMediaCategoryIds(previousLocalCats, categories, allMedia);
  }

  await saveLocalCategoriesToDB(categories);

  mediaStorage = {};
  categories.forEach(c => mediaStorage[c.id] = []);
  allMedia.forEach(item => {
    if (mediaStorage[item.categoryId]) {
      mediaStorage[item.categoryId].push(item);
    }
  });

  if (currentCategoryId && !categories.some(c => c.id === currentCategoryId)) {
    currentCategoryId = categories.length > 0 ? categories[0].id : null;
  }

  if (!document.getElementById("view-gallery").classList.contains("hidden") && currentCategoryId) {
    openCategory(currentCategoryId);
  } else {
    renderCategoryGrid();
  }

  if (!document.getElementById("admin-modal").classList.contains("hidden")) {
    renderAdminCategories();
  }

  updateSyncStatusUI("idle");
}

async function loadDataFromDB() {
  updateSyncStatusUI("saving");
  await initDB();

  const localCats = await getLocalCategoriesFromDB();

  let initialCats = localCats;
  if (!initialCats || initialCats.length === 0) {
    initialCats = DEFAULT_CATEGORIES.map((name, index) => ({
      id: "cat_fixed_" + index,
      name: name,
      order: index
    }));
  }

  // 1. 기기 내부 데이터(IndexedDB)로 즉시 UI 렌더링
  await applyCategoriesAndRender(initialCats, []);

  // 2. 화면 표시 후 백그라운드에서 Firebase SDK 비동기 연결 시도
  initFirebaseSync(initialCats);
}

  const topBar = document.getElementById("top-category-bar");
  topBar.innerHTML = "";

  categories.forEach(cat => {
    const isSelected = currentCategoryId === cat.id;
    const btn = document.createElement("button");
    btn.className = `whitespace-nowrap px-3.5 py-2 rounded-xl text-[13px] sm:text-[14.5px] font-extrabold transition flex items-center gap-1.5 shrink-0 ${
      isSelected 
        ? 'bg-brand text-white shadow-sm scale-[1.01]'

    btn.onclick = () => openCategory(cat.id);

    const count = (mediaStorage[cat.id] || []).length;
    btn.innerHTML = `

function openCategory(catId) {
  currentCategoryId = catId;
  renderTopCategoryBar();
  const category = categories.find(c => c.id === catId);
  if (!category) return;

  const rawItems = mediaStorage[catId] || [];
  const items = sortMediaArray(rawItems);

  document.getElementById("current-category-name").innerText = category.name;
  document.getElementById("current-category-count").innerText = `총 ${items.length}개의 미디어 파일`;
  document.getElementById("header-title").innerHTML = `<span class="text-brand">${category.name}</span>`;

  const galleryGrid = document.getElementById("gallery-grid");
  const emptyState = document.getElementById("gallery-empty");
  galleryGrid.innerHTML = "";

  if (items.length === 0) {
    galleryGrid.classList.add("hidden");
    emptyState.classList.remove("hidden");
    emptyState.classList.add("flex");
  } else {
    galleryGrid.classList.remove("hidden");
    emptyState.classList.add("hidden");
    emptyState.classList.remove("flex");

    items.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = "bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md cursor-pointer aspect-square relative group";
      card.onclick = () => openViewer(idx);

      if (item.type.startsWith("image/")) {
        card.innerHTML = `
          <img src="${item.dataUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${item.name}">
          <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white">
            ${SVG_ICONS.zoomIn}
          </div>
          <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/70 to-transparent p-2">
            <p class="text-[11px] text-white font-medium truncate">${item.name}</p>
          </div>
        `;
      } else {
        card.innerHTML = `
          <video src="${item.dataUrl}" class="w-full h-full object-cover"></video>
          <div class="absolute inset-0 bg-black/40 flex items-center justify-center text-white">
            ${SVG_ICONS.circlePlay}
          </div>
          <span class="absolute top-2 left-2 text-[10px] bg-black/70 text-white px-2 py-0.5 rounded-full font-bold">동영상</span>
          <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/70 to-transparent p-2">
            <p class="text-[11px] text-white font-medium truncate">${item.name}</p>

      }
      galleryGrid.appendChild(card);
    });
  }

  document.getElementById("view-categories").classList.add("hidden");
  document.getElementById("view-gallery").classList.remove("hidden");
  document.getElementById("btn-home").classList.remove("hidden");
}

function goHome() {

  renderCategoryGrid();
}

// ============================================================================
// [전체화면 미디어 뷰어: 핀치 줌 + 더블탭 줌 + 드래그 애니메이션 닫기]
// ============================================================================
let zoomScale = 1;
let panX = 0;
let panY = 0;
let startPanX = 0;
let startPanY = 0;
let initialPinchDistance = null;
let initialZoomScale = 1;
let gestureMode = null; // 'pinch' | 'pan' | 'decide' | 'drag-close' | 'swipe-horizontal'
let touchStartX = 0;
let touchStartY = 0;
let touchCurrentX = 0;
let touchCurrentY = 0;
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;

function getActiveMediaElement() {
  const imgEl = document.getElementById("viewer-image");
  const videoEl = document.getElementById("viewer-video");
  return !imgEl.classList.contains("hidden") ? imgEl : videoEl;
}

function setViewerOverlayOpacity(opacity) {
  const header = document.getElementById("viewer-header");
  const footer = document.getElementById("viewer-footer");
  [header, footer].forEach(el => {
    if (el) el.style.opacity = String(opacity);
  });
}

function updateZoomUI() {
  const resetBtn = document.getElementById("zoom-reset-btn");
  if (!resetBtn) return;
  if (zoomScale > 1.02) {
    resetBtn.classList.remove("hidden");
    resetBtn.classList.add("flex");
    resetBtn.innerText = Math.round(zoomScale * 100) + "%";
  } else {
    resetBtn.classList.add("hidden");
    resetBtn.classList.remove("flex");
  }
}

function applyMediaTransform(withTransition = false) {
  const activeEl = getActiveMediaElement();
  if (!activeEl) return;
  activeEl.style.transition = withTransition ? "transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)" : "none";
  activeEl.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${zoomScale})`;
  updateZoomUI();
}

function resetMediaZoom(withTransition = false) {
  zoomScale = 1;
  panX = 0;
  panY = 0;
  initialPinchDistance = null;
  gestureMode = null;

  const modal = document.getElementById("viewer-modal");
  const imgEl = document.getElementById("viewer-image");
  const videoEl = document.getElementById("viewer-video");

  if (modal) modal.style.backgroundColor = "rgba(0, 0, 0, 1)";
  setViewerOverlayOpacity(1);

  [imgEl, videoEl].forEach(el => {
    if (el) {
      el.style.transition = withTransition ? "transform 0.25s ease-out" : "none";
      el.style.transform = "translate3d(0px, 0px, 0) scale(1)";
    }
  });
  updateZoomUI();
}

function clampPanBounds() {
  const container = document.getElementById("viewer-container");
  if (!container || zoomScale <= 1) {
    panX = 0;
    panY = 0;
    return;
  }
  const maxPanX = (container.clientWidth * (zoomScale - 1)) / 2;
  const maxPanY = (container.clientHeight * (zoomScale - 1)) / 2;
  panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
  panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
}

function getTouchDistance(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.hypot(dx, dy);
}

function openViewer(index) {
  if (!currentCategoryId) return;
  currentMediaList = sortMediaArray(mediaStorage[currentCategoryId] || []);
  if (currentMediaList.length === 0) return;

  currentViewerIndex = index;
  const modal = document.getElementById("viewer-modal");
  modal.classList.remove("hidden");

  resetMediaZoom(false);
  updateViewerContent();
}

function updateViewerContent() {
  resetMediaZoom(false);

  const item = currentMediaList[currentViewerIndex];
  const category = categories.find(c => c.id === currentCategoryId);

  document.getElementById("viewer-category-tag").innerText = category ? category.name : "";
  document.getElementById("viewer-title").innerText = item.name;
  document.getElementById("viewer-index").innerText = currentViewerIndex + 1;
  document.getElementById("viewer-total").innerText = currentMediaList.length;

  const imgEl = document.getElementById("viewer-image");
  const videoEl = document.getElementById("viewer-video");

  imgEl.className = `w-full h-full ${isFitContain ? 'media-fit-contain' : 'media-fit-cover'}`;
  videoEl.className = `w-full h-full ${isFitContain ? 'media-fit-contain' : 'media-fit-cover'}`;

  if (item.type.startsWith("image/")) {
    videoEl.pause();
    videoEl.classList.add("hidden");
    imgEl.src = item.dataUrl;
    imgEl.classList.remove("hidden");
  } else {
    imgEl.classList.add("hidden");
    videoEl.src = item.dataUrl;
    videoEl.classList.remove("hidden");
    videoEl.play().catch(() => {});
  }
}

function closeViewer() {
  const videoEl = document.getElementById("viewer-video");
  videoEl.pause();
  resetMediaZoom(false);
  document.getElementById("viewer-modal").classList.add("hidden");
}

function nextMedia() {
  if (currentMediaList.length === 0) return;
  currentViewerIndex = (currentViewerIndex + 1) % currentMediaList.length;
  updateViewerContent();
}

function prevMedia() {
  if (currentMediaList.length === 0) return;
  currentViewerIndex = (currentViewerIndex - 1 + currentMediaList.length) % currentMediaList.length;
  updateViewerContent();
}

function toggleMediaFit() {
  isFitContain = !isFitContain;
  const fitIcon = document.getElementById("fit-icon");
  if (fitIcon) {
    fitIcon.innerHTML = isFitContain ? SVG_ICONS.expand : SVG_ICONS.compress;
  }
  updateViewerContent();
}

const viewerContainer = document.getElementById("viewer-container");

viewerContainer.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    gestureMode = "pinch";
    initialPinchDistance = getTouchDistance(e.touches[0], e.touches[1]);
    initialZoomScale = zoomScale;
    return;
  }

  if (e.touches.length === 1) {
    const touch = e.touches[0];
    const now = Date.now();

    const videoEl = document.getElementById("viewer-video");
    if (!videoEl.classList.contains("hidden") && touch.clientY > window.innerHeight - 80) {
      gestureMode = null;
      return;
    }

    if (now - lastTapTime < 300 && Math.hypot(touch.clientX - lastTapX, touch.clientY - lastTapY) < 35) {
      e.preventDefault();
      if (zoomScale > 1.05) {
        resetMediaZoom(true);
      } else {
        zoomScale = 2.5;
        panX = 0;
        panY = 0;
        applyMediaTransform(true);
      }
      lastTapTime = 0;
      gestureMode = null;
      return;
    }

    lastTapTime = now;
    lastTapX = touch.clientX;
    lastTapY = touch.clientY;

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchCurrentX = touch.clientX;
    touchCurrentY = touch.clientY;

    if (zoomScale > 1.02) {
      gestureMode = "pan";
      startPanX = touch.clientX - panX;
      startPanY = touch.clientY - panY;
    } else {
      gestureMode = "decide";
    }
  }
}, { passive: false });

viewerContainer.addEventListener("touchmove", (e) => {
  if (!gestureMode) return;

  if (gestureMode === "pinch" && e.touches.length === 2) {
    e.preventDefault();
    const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
    if (initialPinchDistance && initialPinchDistance > 0) {
      const ratio = currentDist / initialPinchDistance;
      zoomScale = Math.min(Math.max(1, initialZoomScale * ratio), 4);
      clampPanBounds();
      applyMediaTransform(false);
    }
    return;
  }

  if (e.touches.length !== 1) return;
  const touch = e.touches[0];
  touchCurrentX = touch.clientX;
  touchCurrentY = touch.clientY;

  const dx = touchCurrentX - touchStartX;
  const dy = touchCurrentY - touchStartY;

  if (gestureMode === "pan") {
    e.preventDefault();
    panX = touch.clientX - startPanX;
    panY = touch.clientY - startPanY;
    clampPanBounds();
    applyMediaTransform(false);
    return;
  }

  if (gestureMode === "decide") {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;

    if (dy > 0 && Math.abs(dy) > Math.abs(dx) * 1.2) {
      gestureMode = "drag-close";
    } else if (Math.abs(dx) > Math.abs(dy)) {
      gestureMode = "swipe-horizontal";
    } else {
      gestureMode = null;
      return;
    }
  }

  if (gestureMode === "drag-close") {
    e.preventDefault();
    const dragY = Math.max(0, dy);
    const dragX = dx * 0.25;
    const dragScale = Math.max(0.78, 1 - dragY / 1000);
    const bgAlpha = Math.max(0.15, 1 - dragY / 380);
    const uiOpacity = Math.max(0, 1 - dragY / 180);

    const activeEl = getActiveMediaElement();
    const modal = document.getElementById("viewer-modal");

    if (activeEl) {
      activeEl.style.transition = "none";
      activeEl.style.transform = `translate3d(${dragX}px, ${dragY}px, 0) scale(${dragScale})`;
    }
    if (modal) {
      modal.style.backgroundColor = `rgba(0, 0, 0, ${bgAlpha})`;
    }
    setViewerOverlayOpacity(uiOpacity);
  }
}, { passive: false });

viewerContainer.addEventListener("touchend", (e) => {
  if (gestureMode === "pinch") {
    if (zoomScale < 1.05) {
      resetMediaZoom(true);
    } else if (e.touches.length === 1) {
      gestureMode = "pan";
      startPanX = e.touches[0].clientX - panX;
      startPanY = e.touches[0].clientY - panY;
    } else {
      gestureMode = null;
    }
    return;
  }

  if (gestureMode === "drag-close") {
    const dy = touchCurrentY - touchStartY;
    const activeEl = getActiveMediaElement();
    const modal = document.getElementById("viewer-modal");

    if (dy > 110) {
      if (activeEl) {
        activeEl.style.transition = "transform 0.2s ease-in, opacity 0.2s ease-in";
        activeEl.style.transform = `translate3d(0px, ${window.innerHeight}px, 0) scale(0.75)`;
      }
      if (modal) {
        modal.style.backgroundColor = "rgba(0, 0, 0, 0)";
      }
      setTimeout(() => {
        if (activeEl) activeEl.style.opacity = "1";
        closeViewer();
      }, 200);
    } else {
      resetMediaZoom(true);
    }
    gestureMode = null;
    return;
  }

  if (gestureMode === "swipe-horizontal") {
    const dx = touchCurrentX - touchStartX;
    if (dx < -50) nextMedia();
    if (dx > 50) prevMedia();
    gestureMode = null;
    return;
  }

  if (e.touches.length === 0) {
    gestureMode = null;
  }
}, false);

function toggleAdminModal(show) {
  const modal = document.getElementById("admin-modal");
  if (show) {
    renderAdminCategories();
    modal.classList.remove("hidden");
  } else {
    modal.classList.add("hidden");
    if (currentCategoryId) {
      openCategory(currentCategoryId);
    } else {
      renderCategoryGrid();
    }
  }
}

function renderAdminCategories() {
  const catList = document.getElementById("admin-category-list");
  document.getElementById("cat-count").innerText = categories.length;
  catList.innerHTML = "";

  if (!currentCategoryId && categories.length > 0) {
    currentCategoryId = categories[0].id;
  }

  categories.forEach((cat, idx) => {
    const isSelected = cat.id === currentCategoryId;
    const isFirst = idx === 0;
    const isLast = idx === categories.length - 1;

    const row = document.createElement("div");
    row.className = `w-full px-3 py-2 rounded-lg text-xs font-bold flex justify-between items-center gap-1 transition cursor-pointer ${
      isSelected ? 'bg-brand text-white shadow-sm' : 'bg-white text-gray-700 hover:bg-gray-200 border border-gray-200'
    }`;
    row.onclick = () => selectAdminCategory(cat.id);

    const leftPart = document.createElement("div");
    leftPart.className = "flex items-center gap-1.5 min-w-0 flex-1";
    leftPart.innerHTML = `
      <span class="truncate">${cat.name}</span>
      <span class="text-[10px] shrink-0 opacity-80 ${isSelected ? 'bg-white/20 text-white' : 'bg-black/10 text-gray-700'} px-1.5 py-0.5 rounded">
        ${(mediaStorage[cat.id] || []).length}개
      </span>
    `;

    const orderControls = document.createElement("div");
    orderControls.className = "flex items-center gap-1 shrink-0";

    const upBtn = document.createElement("button");
    upBtn.type = "button";
    upBtn.title = "위로 이동";
    upBtn.disabled = isFirst;
    upBtn.className = `w-6 h-6 rounded flex items-center justify-center transition ${
      isFirst
        ? 'opacity-30 cursor-not-allowed'
        : isSelected
          ? 'hover:bg-white/20 text-white'
          : 'hover:bg-gray-300 text-gray-600'
    }`;
    upBtn.innerHTML = SVG_ICONS.chevronUp;
    upBtn.onclick = (e) => moveCategoryOrder(idx, -1, e);

    const downBtn = document.createElement("button");
    downBtn.type = "button";
    downBtn.title = "아래로 이동";
    downBtn.disabled = isLast;
    downBtn.className = `w-6 h-6 rounded flex items-center justify-center transition ${
      isLast
        ? 'opacity-30 cursor-not-allowed'
        : isSelected
          ? 'hover:bg-white/20 text-white'
          : 'hover:bg-gray-300 text-gray-600'
    }`;
    downBtn.innerHTML = SVG_ICONS.chevronDown;
    downBtn.onclick = (e) => moveCategoryOrder(idx, 1, e);

    orderControls.appendChild(upBtn);
    orderControls.appendChild(downBtn);

    row.appendChild(leftPart);
    row.appendChild(orderControls);
    catList.appendChild(row);
  });

  renderAdminMediaGrid();
}

async function moveCategoryOrder(index, direction, event) {
  event.stopPropagation();
  const targetIndex = index + direction;
  if (targetIndex < 0 || targetIndex >= categories.length) return;

  const temp = categories[index];
  categories[index] = categories[targetIndex];
  categories[targetIndex] = temp;

  categories.forEach((cat, idx) => {
    cat.order = idx;
  });

  await persistCategories();
  renderAdminCategories();
  renderTopCategoryBar();
}

function selectAdminCategory(catId) {
  currentCategoryId = catId;
  renderAdminCategories();
}

function renderAdminMediaGrid() {
  const category = categories.find(c => c.id === currentCategoryId);
  const titleEl = document.getElementById("admin-selected-cat-title");
  const grid = document.getElementById("admin-media-grid");

  if (!category) {
    titleEl.innerText = "카테고리를 선택하세요";
    grid.innerHTML = "";
    return;
  }

  titleEl.innerText = category.name;
  const items = sortMediaArray(mediaStorage[currentCategoryId] || []);
  grid.innerHTML = "";

  items.forEach(item => {
    const itemCard = document.createElement("div");
    itemCard.className = "relative aspect-square border border-gray-200 rounded-lg overflow-hidden group bg-black";

    if (item.type.startsWith("image/")) {
      itemCard.innerHTML = `
        <img src="${item.dataUrl}" class="w-full h-full object-cover">
        <div class="absolute bottom-0 inset-x-0 bg-black/70 px-1.5 py-1">
          <p class="text-[10px] text-white truncate">${item.name}</p>
        </div>
      `;
    } else {
      itemCard.innerHTML = `
        <video src="${item.dataUrl}" class="w-full h-full object-cover"></video>
        <div class="absolute bottom-0 inset-x-0 bg-black/70 px-1.5 py-1">
          <p class="text-[10px] text-white truncate">${item.name}</p>
        </div>
      `;
    }

    const delBtn = document.createElement("button");
    delBtn.className = "absolute top-1 right-1 w-6 h-6 bg-red-600 text-white rounded-full flex items-center justify-center text-xs opacity-90 hover:opacity-100 shadow";
    delBtn.innerHTML = SVG_ICONS.xmark;
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      await deleteMediaItemFromDB(item.id);
      mediaStorage[currentCategoryId] = mediaStorage[currentCategoryId].filter(m => m.id !== item.id);
      renderAdminCategories();
      renderTopCategoryBar();
    };

    itemCard.appendChild(delBtn);
    grid.appendChild(itemCard);
  });
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = (err) => reject(err);
    reader.readAsDataURL(file);
  });
}

async function handleFileUpload(event) {
  const fileList = event.target.files;
  if (!fileList || fileList.length === 0 || !currentCategoryId) return;

  const validFiles = Array.from(fileList).filter(
    f => f.type && (f.type.startsWith("image/") || f.type.startsWith("video/"))
  );

  if (validFiles.length === 0) {
    event.target.value = "";
    return;
  }

  validFiles.sort((a, b) => a.name.localeCompare(b.name, "ko", { numeric: true, sensitivity: "base" }));

  const baseTime = Date.now();
  for (let i = 0; i < validFiles.length; i++) {
    const file = validFiles[i];
    const dataUrl = await readFileAsDataURL(file);
    const mediaObj = {
      id: "media_" + baseTime + "_" + i + "_" + Math.random().toString(36).substr(2, 5),
      categoryId: currentCategoryId,
      name: file.name,
      type: file.type,
      dataUrl: dataUrl,
      createdAt: baseTime + i
    };
    await saveMediaItem(mediaObj);
    if (!mediaStorage[currentCategoryId]) mediaStorage[currentCategoryId] = [];
    mediaStorage[currentCategoryId].push(mediaObj);
  }

  renderAdminCategories();
  renderTopCategoryBar();
  event.target.value = "";
}

async function addNewCategoryPrompt() {
  const name = prompt("새 카테고리 이름을 입력하세요:");
  if (name && name.trim()) {
    const newCat = {
      id: "cat_" + Date.now(),
      name: name.trim(),
      order: categories.length
    };
    categories.push(newCat);
    mediaStorage[newCat.id] = [];
    currentCategoryId = newCat.id;
    await persistCategories();
    renderAdminCategories();
    renderTopCategoryBar();
  }
}

async function renameSelectedCategory() {
  const category = categories.find(c => c.id === currentCategoryId);
  if (!category) return;
  const newName = prompt("카테고리 이름 수정:", category.name);
  if (newName && newName.trim()) {
    category.name = newName.trim();
    await persistCategories();
    renderAdminCategories();
    renderTopCategoryBar();
  }
}

async function deleteSelectedCategory() {
  if (!currentCategoryId) return;
  if (confirm("이 카테고리가 모든 기기에서 삭제되며, 현재 기기의 해당 미디어 파일도 함께 삭제됩니다. 계속하시겠습니까?")) {
    const items = mediaStorage[currentCategoryId] || [];
    for (let item of items) {
      await deleteMediaItemFromDB(item.id);
    }
    delete mediaStorage[currentCategoryId];
    categories = categories.filter(c => c.id !== currentCategoryId);
    categories.forEach((cat, idx) => {
      cat.order = idx;
    });
    currentCategoryId = categories.length > 0 ? categories[0].id : null;
    await persistCategories();
    renderAdminCategories();
    renderTopCategoryBar();
  }
}

function openCategoryAdminFromGallery() {
  requestAdminAccess();
}

document.addEventListener("keydown", (e) => {
  const viewerModal = document.getElementById("viewer-modal");
  const pwModal = document.getElementById("password-modal");
  if (!viewerModal.classList.contains("hidden")) {
    if (e.key === "ArrowRight") nextMedia();
    if (e.key === "ArrowLeft") prevMedia();
    if (e.key === "Escape") closeViewer();
  } else if (!pwModal.classList.contains("hidden")) {
    if (e.key === "Escape") closePasswordModal();
  }
});

window.onload = () => {
  updateSyncStatusUI("idle");
  loadDataFromDB();
};
